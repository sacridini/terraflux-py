#
# The documentation is on Terraflux's website (https://sacridini.github.io/terraflux/python/), built from
# Terraflux's repository (sacridini/terraflux, website/). This repository's GitHub Pages site
# (https://sacridini.github.io/terraflux-py/) holds only redirects: each page of the old MkDocs site, at its old
# path, sends to its page on Terraflux's website (pages/, the same pages as sacridini.github.io/landschaft/,
# made from Terraflux's website/LANDSCHAFT_PAGES.md). Actions > Docs > Run workflow publishes them again.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
